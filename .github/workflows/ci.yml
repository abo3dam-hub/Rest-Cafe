name: CI

# Lean validation for the Rest&Cafe fork: lint, builds, and the focused
# suites that pin the local-only contract. Upstream's full gate matrix
# (cross-platform release checks, review bots, private specs) does not
# apply to this fork's manual distribution model.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build, focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build backend and frontend
        run: |
          npm run build
          npm run build:frontend

      - name: Focused suites (local-only contract)
        run: |
          npm run test:url-allowlist
          npm run test:offline-mode
          npm run test:first-run
          npm run test:tax-pack-catalog
          npm run test:electron-api-contract
          npm run test:print-parity
          npm run test:script-coverage
